<!doctype html>
<html><head><meta charset="utf-8"><title>Mutated: table layout, placeholder-only label, shadow DOM state</title></head>
<body>
<table>
  <tr><td>Your details</td><td>
    <!-- no <label>: the only hint is the placeholder -->
    <input type="text" placeholder="First name" id="x1" name="y1">
    <input type="text" placeholder="Last name" id="x2" name="y2">
  </td></tr>
  <tr><td>Gender</td><td>
    <!-- plain text next to radios, no <label> elements -->
    <input type="radio" name="zz" value="a"> Male
    <input type="radio" name="zz" value="b"> Female
    <input type="radio" name="zz" value="c"> Transgender
  </td></tr>
  <tr><td colspan="2"><div id="host"></div></td></tr>
</table>
<script>
  // The State dropdown is rendered inside an open shadow root.
  const root = document.getElementById('host').attachShadow({mode: 'open'});
  root.innerHTML = '<label for="s">State</label> <select id="s"><option value="">Choose</option>' +
                   '<option>Goa</option><option>Kerala</option><option>Texas</option></select>';
</script>
</body></html>
