<!doctype html>
<html><head><meta charset="utf-8"><title>Baseline form</title></head>
<body>
<form>
  <div><label for="fname">First Name</label> <input type="text" id="fname" name="fname"></div>
  <div><label for="lname">Last Name</label> <input type="text" id="lname" name="lname"></div>
  <div>Gender
    <input type="radio" name="gender" value="male" id="g1"><label for="g1">Male</label>
    <input type="radio" name="gender" value="female" id="g2"><label for="g2">Female</label>
    <input type="radio" name="gender" value="other" id="g3"><label for="g3">Transgender</label>
  </div>
  <div><label for="country">Country</label>
    <select id="country"><option value="">-- Select Country --</option><option>India</option><option>Canada</option></select></div>
  <div><label for="state">State</label>
    <select id="state" name="state"><option value="">-- Select State --</option><option>Goa</option><option>Kerala</option><option>Texas</option></select></div>
</form>
</body></html>
